[project]
name = "spend-analytics-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "strands-agents>=0.1.0",
    "bedrock-agentcore>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "boto3>=1.35.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "duckdb>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
